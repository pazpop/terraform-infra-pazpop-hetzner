http:
  middlewares:
    # Par IP source (comportement par défaut du middleware) : un client
    # normal ne s'approche jamais de 20 req/s en usage courant (chargement
    # de page, appels API du jeu), donc plafonner ici gêne uniquement les
    # scans/bots agressifs et les tentatives de brute-force applicatif —
    # fail2ban ne protège que SSH, rien côté 80/443 avant ce middleware.
    rate-limit:
      rateLimit:
        average: 20
        period: 1s
        burst: 40

    # Plafonne la taille du BODY envoyé par le client (requêtes POST) — sans
    # ça, un payload énorme serait lu en mémoire par le backend avant même
    # que Pydantic ne le rejette. Seul maxRequestBodyBytes est posé : ne
    # jamais toucher maxResponseBodyBytes ici, ça limiterait aussi ce que le
    # serveur RENVOIE (fichiers statiques, musique .xm de plusieurs centaines
    # de Ko) — or ce middleware n'est attaché qu'au routeur API
    # (docker-compose.yml, arcadepipe-api), jamais à celui qui sert le jeu.
    # 10 Ko : un score (pseudo + 3 entiers en JSON) tient sur quelques
    # dizaines d'octets, large marge sans jamais gêner un usage normal.
    api-body-limit:
      buffering:
        maxRequestBodyBytes: 10240

    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        # 'unsafe-eval' : requis par lib/libopenmpt.js (arcadepipe), généré
        # par Emscripten en asm.js (pas du WebAssembly — aucun .wasm séparé),
        # qui utilise eval() dans son code d'initialisation. 'unsafe-inline'
        # sur style-src : le portail (portal/generator/generate.sh) génère un
        # <style> inline dans le <head> de sa page. googletagmanager.com sur
        # script-src/connect-src : Google Analytics (arcadepipe, voir
        # js/analytics.js côté frontend) — chargé en <script src> classique,
        # jamais inline, donc pas besoin de 'unsafe-inline' sur script-src
        # pour ça. Portail-wide comme le reste de ce middleware : s'applique
        # à tous les jeux/sites derrière ce Traefik, pas qu'arcadepipe.
        # Vérifié avant application en relisant les sources concernées, pas
        # une valeur par défaut copiée sans réfléchir.
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'"
        customResponseHeaders:
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
          Server: ""
