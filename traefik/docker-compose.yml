# Sans limite, le driver par défaut (json-file) accumule les logs
# indéfiniment sur le disque de la VPS — un service qui boucle sur une
# erreur peut le remplir en continu, une panne bien plus bête (et bien
# plus facile à déclencher, même sans intention malveillante) qu'une
# vraie attaque. 10m x 3 fichiers par conteneur = 30m max.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Proxy en lecture seule vers le socket Docker, joignable uniquement depuis
  # le réseau interne traefik-internal (jamais traefik-public) — même
  # raisonnement que portal/docker-compose.yml : monter docker.sock
  # directement (même en :ro) donne un accès root-équivalent à l'hôte, le
  # flag :ro d'un bind mount ne restreint pas les appels à l'API Docker qui
  # passent au travers. N'autorise que la lecture des conteneurs/réseaux
  # (CONTAINERS=1, NETWORKS=1) — tout le reste (exec, create, mount...) est
  # refusé par défaut.
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    environment:
      - CONTAINERS=1
      - NETWORKS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-internal
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.1

  # Seul service exposé au monde extérieur sur la VPS (ports 80/443).
  # Les apps (ex: arcadepipe) rejoignent le réseau externe "traefik-public"
  # et se déclarent via labels — aucune n'a besoin de publier de port.
  traefik:
    # >= v3.6.1 requis : les versions antérieures négocient une version
    # d'API Docker figée à 1.24, insuffisante pour Docker >= 29 (minimum
    # relevé à 1.44).
    image: traefik:v3.7
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Plus d'accès direct à /var/run/docker.sock : tout passe par
      # docker-socket-proxy ci-dessus.
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik-public
      - traefik-internal
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    depends_on:
      - docker-socket-proxy

networks:
  traefik-public:
    name: traefik-public
    external: true
  traefik-internal:
    name: traefik-internal

volumes:
  letsencrypt:
