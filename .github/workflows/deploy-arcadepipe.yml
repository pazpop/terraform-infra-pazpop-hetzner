name: Deploy ArcadePipe

# Déclenché automatiquement par le CI du repo applicatif (github.com/pazpop/
# arcadepipe, public) une fois une nouvelle image poussée sur GHCR — voir
# .github/workflows/deploy.yml dans ce repo-là, étape "Notifier
# terraform-infra-pazpop-hetzner". `workflow_dispatch` permet aussi de
# redéployer manuellement depuis l'onglet Actions sans rien avoir à pousser
# (utile pour un rollback ou pour retenter après un échec).
on:
  repository_dispatch:
    types: [arcadepipe-published]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Épinglé par SHA (pas par tag) : un tag comme "v1" peut être redéployé
      # vers un autre commit sans qu'aucun changement n'apparaisse ici. SHA
      # vérifié contre refs/tags/v1 de chaque repo avant de l'écrire ici.
      # Dependabot (.github/dependabot.yml) ouvre une PR à chaque nouvelle
      # version, donc rien à surveiller à la main malgré le pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # docker-compose.yml (labels Traefik, limites de ressources...) n'est
      # pas embarqué dans les images : sans cette étape, ses changements ne
      # seraient jamais répercutés sur la VPS.
      #
      # `fingerprint:` — sans lui, ces actions acceptent silencieusement la
      # clé d'hôte présentée par DEPLOY_HOST, quelle qu'elle soit (pas de
      # TOFU-style "first connect", pas d'erreur si elle a changé) : rien
      # n'empêcherait un MITM sur ce chemin, qui transporte pourtant le
      # secret SSH complet à chaque commit. Empreinte SHA256 obtenue via
      # `ssh-keyscan -p 2222 <IP> | ssh-keygen -lf -` et stockée dans le
      # secret DEPLOY_SSH_FINGERPRINT (pas en clair ici : rien de sensible
      # dans une empreinte de clé publique, mais aucune raison de la sortir
      # du même mécanisme de secrets que le reste). Si le VPS est un jour
      # recréé (nouvelle paire de clés hôte), ce secret doit être régénéré
      # avec la même commande, sinon ce workflow se met à échouer — c'est le
      # comportement voulu, pas un bug : mieux vaut un déploiement qui
      # s'arrête que d'accepter une clé qu'on n'a pas vérifiée.
      - name: Sync docker-compose.yml
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: 2222
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          debug: true
          source: docker/arcadepipe/docker-compose.yml
          target: ~/arcadepipe
          strip_components: 2

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: 2222
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          # `set -e` : sans ça, un `docker compose pull` en échec (ex: image
          # privée/inaccessible) n'empêche pas `up -d` de s'exécuter quand
          # même — le job rapporte "succès" alors qu'il vient de redémarrer
          # les conteneurs sur l'ANCIENNE image en cache local, sans jamais
          # récupérer la nouvelle. Découvert lors de la toute première
          # exécution réelle de ce workflow.
          script: |
            set -e
            cd ~/arcadepipe
            docker compose pull
            docker compose up -d
            docker image prune -f
