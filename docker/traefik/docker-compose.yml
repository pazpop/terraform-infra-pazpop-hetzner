# Logs Docker plafonnés (10 Mo x 3 par conteneur) : le driver par défaut accumule à l'infini
# et peut remplir le disque de la VPS.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Proxy en lecture seule vers le socket Docker (réseau interne traefik-internal
  # uniquement). Monter docker.sock, même en :ro, donnerait un accès root à l'hôte :
  # :ro ne restreint pas les appels à l'API. CONTAINERS=1 et NETWORKS=1 s'ajoutent à ce que l'image autorise par défaut (événements, ping, version).
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    environment:
      - CONTAINERS=1
      - NETWORKS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-internal
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    # Le proxy répond : sans lui, --wait (deploy.sh) le dirait prêt alors qu'il redémarre en boucle.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    mem_limit: 64m
    cpus: 0.1

  # Seul service exposé au monde extérieur sur la VPS (ports 80/443).
  # Les apps (ex: arcadepipe) rejoignent le réseau externe "traefik-public"
  # et se déclarent via labels — aucune n'a besoin de publier de port.
  traefik:
    image: traefik:v3.7.13
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Pas de /var/run/docker.sock : tout passe par docker-socket-proxy ci-dessus.
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik-public
      - traefik-internal
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    depends_on:
      - docker-socket-proxy

networks:
  traefik-public:
    name: traefik-public
    external: true
  traefik-internal:
    name: traefik-internal

volumes:
  letsencrypt:
