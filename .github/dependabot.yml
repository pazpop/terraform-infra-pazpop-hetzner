version: 2
updates:
  # Actions épinglées par SHA : Dependabot lit le commentaire "# vX" et propose le nouveau SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Images épinglées (lignes image: des compose, FROM des Dockerfile), un répertoire par stack.
  # docker/arcadepipe n'y est pas : ses images :latest viennent du CI d'arcadepipe.
  - package-ecosystem: "docker-compose"
    directories: ["/docker/gramps", "/docker/traefik", "/docker/portal"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories: ["/backup", "/docker/portal/generator", "/docker/portal/web"]
    schedule:
      interval: "weekly"

  # Fournisseur Hetzner d'OpenTofu (terraform/.terraform.lock.hcl).
  - package-ecosystem: "opentofu"
    directory: "/terraform"
    schedule:
      interval: "weekly"
