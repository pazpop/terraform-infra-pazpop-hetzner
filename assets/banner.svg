    </linearGradient>
  </defs>

  <rect width="780" height="160" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="778" height="158" rx="13" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Petit rack serveur, couleur violette Terraform/OpenTofu -->
